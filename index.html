<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#142b43">
<meta name="description" content="Учебный справочник по магнитно-резонансной томографии для рентген-лаборантов">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>МРТ-Помощник</title>
<style>
:root{--navy:#142b43;--blue:#28658a;--cyan:#bce9f5;--bg:#f3f6f8;--card:#fff;--ink:#172533;--muted:#657583;--line:#dce5eb;--accent:#e7f4f8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}
header{background:var(--navy);color:white;padding:22px max(18px,calc((100% - 980px)/2)) 26px}
.brand{display:flex;align-items:center;gap:12px}.logo{width:44px;height:44px;border-radius:14px;background:#234966;display:grid;place-items:center;font-size:24px}
h1{font-size:24px;margin:0}header p{color:#c8d9e5;margin:5px 0 0;font-size:14px}
main{max-width:980px;margin:auto;padding:18px}
.search{width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:14px;font:inherit;background:white;margin-bottom:16px}
.hero{background:linear-gradient(130deg,#183852,#28658a);color:white;padding:20px;border-radius:18px;margin-bottom:18px}
.hero h2{margin:0 0 7px;font-size:21px}.hero p{margin:0;color:#dceaf1}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:left;cursor:pointer;transition:.15s}
.card:hover{border-color:#7eb6ce;transform:translateY(-1px)}.card .ico{font-size:25px}.card h3{margin:8px 0 4px;font-size:17px}.card p{margin:0;color:var(--muted);font-size:14px}
button{font:inherit}.back{border:0;background:transparent;color:var(--blue);padding:8px 0;cursor:pointer;font-weight:650}
.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:10px}
.panel h2{margin:0 0 8px}.panel h3{margin:20px 0 6px}.panel p{margin:8px 0}.panel ul{padding-left:22px}
.tag{display:inline-block;background:var(--accent);color:#20516e;border-radius:99px;padding:4px 10px;font-size:12px;margin:3px 4px 3px 0}
.note{background:#fff8e7;border-left:4px solid #d7a43b;padding:12px 14px;border-radius:8px;margin:14px 0;font-size:14px}
.info{background:#edf6fa;border-left:4px solid #5d9db9;padding:12px 14px;border-radius:8px;margin:14px 0;font-size:14px}
.term{padding:12px 0;border-bottom:1px solid var(--line)}.term:last-child{border:0}.term strong{color:#173e59}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.primary,.secondary{border:0;border-radius:11px;padding:11px 15px;cursor:pointer}.primary{background:var(--blue);color:white}.secondary{background:#eaf1f5;color:#214b66}
.answer{display:block;width:100%;text-align:left;background:#f7fafb;border:1px solid var(--line);border-radius:11px;padding:12px;margin:8px 0;cursor:pointer}.answer.correct{border-color:#27966a;background:#edf8f2}.answer.wrong{border-color:#c65c5c;background:#fff1f1}
.small{color:var(--muted);font-size:13px}footer{text-align:center;color:var(--muted);padding:26px 12px;font-size:12px}
.calcgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px;margin:12px 0}.calcgrid label,.panel>label{display:block;font-size:14px;color:var(--muted);margin:10px 0}.calcgrid input,.panel>label input{display:block;width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;font:inherit;color:var(--ink);background:#fff;margin-top:4px}.resultbox{background:#edf6fa;border:1px solid #c8e0eb;border-radius:12px;padding:14px;margin:12px 0;font-weight:600}.hidden{display:none!important}
@media(max-width:520px){header{padding:18px}main{padding:14px}.hero{padding:17px}.panel{padding:16px}}
</style>
</head>
<body>
<header><div class="brand"><div class="logo">🧲</div><div><h1>МРТ-Помощник</h1><p>База знаний рентген-лаборанта · учебная версия 2.0</p></div></div></header>
<main>
<div id="home">
<input id="search" class="search" type="search" placeholder="Поиск: TR, T2, FOV, артефакты…">
<section class="hero"><h2>МРТ — от принципов к практике</h2><p>Короткие объяснения, справочник параметров, протоколы и проверка знаний.</p></section>
<div id="modules" class="grid"></div>
</div>
<div id="detail" class="hidden"><button class="back" id="back">← Все разделы</button><article class="panel" id="content"></article></div>
<footer>Учебный справочник. Не заменяет локальные протоколы, инструкцию производителя и решение врача-рентгенолога.</footer>
</main>
<script src="app.js"></script>
</body></html>
